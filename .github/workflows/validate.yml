name: Validate RTS

on:
  pull_request:
  push:
    branches: [main, 'feat/first-playable-rts']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  browser-match:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mobile: [chromium, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium ${{ matrix.mobile == 'webkit' && 'webkit' || '' }}
      - run: npm run build
      - run: npm run test:browser
        env:
          MOBILE_BROWSER: ${{ matrix.mobile }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics-${{ matrix.mobile }}
          path: test-results/
