services:
  - type: web
    name: ash-and-iron
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    numInstances: 1
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
